<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Extrator de Números</title>
  <style>
    :root {
      --primary: #8f4cff; --primary-hover: #c052ff; --bg-color: #0d0a16;
      --text: #f7f4ff; --muted: #b8aecb; --border: rgba(255,255,255,.11); --success: #10b981;
      --danger: #ef476f; --orange:#ff9f2f; --purple2:#c052ff;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      padding: 8px; width: 400px; background:
        radial-gradient(circle at 85% 0%, rgba(143,76,255,.20), transparent 42%),
        radial-gradient(circle at 10% 100%, rgba(255,159,47,.10), transparent 38%),
        var(--bg-color);
      color: var(--text); margin: 0; overflow: hidden;
    }
    .header { display:flex; background:linear-gradient(90deg,rgba(143,76,255,.10),rgba(255,159,47,.03)); align-items:center; gap:7px; margin-bottom:6px;
      border-bottom:1px solid var(--border); padding-bottom:5px; }
    .header img { width:24px; height:24px; }
    .header-title-wrapper { display:flex; align-items:baseline; gap:6px; }
    h3 { margin:0; font-size:1.05rem; background:linear-gradient(90deg,var(--orange),var(--purple2)); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:700; }
    .versao { font-size:.75rem; color:var(--muted); font-weight:600;
      background:rgba(255,255,255,.08); padding:1px 5px; border-radius:4px; }
    .controles { display:grid; grid-template-columns:1fr 1fr; gap:6px;
      background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.025)); padding:6px 8px; border:1px solid var(--border);
      border-radius:6px; margin-bottom:6px; }
    .radio-group { display:grid; grid-template-columns:1fr 1fr; gap:4px 5px; font-size:.73rem; }
    .check-group { display:flex; flex-direction:column; gap:4px; font-size:.72rem;
      border-left:1px solid var(--border); padding-left:7px; justify-content:center; }
    label { cursor:pointer; display:flex; align-items:center; gap:4px; white-space:nowrap; }
    input[type=radio], input[type=checkbox] { margin:0; cursor:pointer; }
    textarea { display:block; width:100%; height:64px; padding:6px 7px; border:1px solid var(--border);
      border-radius:6px; resize:none; font-family:monospace; font-size:.8rem; margin-bottom:5px; }
    textarea:focus { outline:2px solid rgba(143,76,255,.65); border-color:transparent; }
    .resumo { display:flex; flex-wrap:wrap; gap:4px; margin:0 0 5px; }
    .contador { background:rgba(255,255,255,.08); color:#d9caff; border-radius:5px; padding:2px 5px;
      font-size:.66rem; font-weight:600; }
    .contador.alerta { background:rgba(239,71,111,.16); color:#ffb4c2; }
    .resultado { white-space:pre-wrap; overflow-wrap:anywhere; background:rgba(255,255,255,.035);
      border:1px solid var(--border); border-radius:6px; padding:7px 8px;
      margin-bottom:5px; height:76px; overflow-y:auto; font-family:monospace;
      font-size:.78rem; color:#f7f4ff; }
    .rotulo { font-size:.72rem; font-weight:700; margin:1px 0 4px; }
    .botoes { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
    button { background:linear-gradient(135deg,var(--orange),var(--purple)); color:#fff; border:1px solid rgba(255,255,255,.12); padding:6px 7px;
      border-radius:5px; cursor:pointer; font-weight:600; font-size:.75rem; transition:background .15s, box-shadow .15s, transform .1s; box-shadow:0 1px 4px rgba(0,0,0,.18); }
    button:hover { background:linear-gradient(135deg,#ffae43,#c052ff); box-shadow:0 2px 7px rgba(192,82,255,.28); }
    button:active { transform:scale(.99); }
    .botoes button {
      background:
        linear-gradient(#0d0a16,#0d0a16) padding-box,
        linear-gradient(135deg,var(--orange),var(--purple2)) border-box;
      color:#fff;
      border:1px solid transparent;
    }
    .botoes button:hover {
      background:
        linear-gradient(#171126,#171126) padding-box,
        linear-gradient(135deg,var(--orange),var(--purple2)) border-box;
      box-shadow:0 2px 8px rgba(192,82,255,.32);
    }
    .btn-largo { grid-column:span 2; }
    .btn-perigo { background:linear-gradient(135deg,#ff9f2f,#ef476f)!important; }
    .btn-perigo:hover { background:linear-gradient(135deg,#ffad3d,#f45b7b)!important; box-shadow:0 2px 8px rgba(239,71,111,.30); }
    .sucesso { background:linear-gradient(135deg,#0ea66f,#13c48b)!important; }
    .ajuda { font-size:.64rem; color:var(--muted); line-height:1.2; margin:4px 1px 0; }
    .status { min-height:12px; font-size:.66rem; color:var(--muted); margin:3px 1px 0; }

    .gravador-separador { margin-top:7px; border-top:1px solid var(--border); padding-top:6px; }
    #btn-gravar { background:linear-gradient(135deg,#ff9f2f,#c052ff); }
    #btn-gravar:hover { background:linear-gradient(135deg,#ffad3d,#c052ff); }
    .gravador-info { font-size:.62rem; color:var(--muted); margin:3px 1px 0; }

    @media (max-width: 360px) { body { width:340px; } .controles { grid-template-columns:1fr 1fr; } }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Ícone">
    <div class="header-title-wrapper">
      <h3>Extrator de Números</h3>
      <span id="versao-app" class="versao">v--</span>
    </div>
  </div>

  <div class="controles">
    <div class="radio-group" role="group" aria-label="Tipo de extração">
      <label><input type="radio" name="tipo" value="AUTO"> Automático</label>
      <label><input type="radio" name="tipo" value="CNJ" checked> Processo CNJ</label>
      <label><input type="radio" name="tipo" value="CPF"> CPF</label>
      <label><input type="radio" name="tipo" value="CNPJ"> CNPJ</label>
      <label><input type="radio" name="tipo" value="9_10_digitos"> Dígitos (9–10)</label>
    </div>
    <div class="check-group">
      <label><input type="checkbox" id="remover-duplicados" checked> Sem duplicados</label>
      <label><input type="checkbox" id="validar-dv" checked> Validar dígitos</label>
      <label><input type="checkbox" id="com-mascara" checked> Exibir máscara</label>
    </div>
  </div>

  <textarea id="entrada" placeholder="Cole o texto aqui..." aria-label="Texto para extrair"></textarea>
  <div class="resumo" aria-live="polite">
    <span class="contador" id="cnt-encontrados">Encontrados: 0</span>
    <span class="contador" id="cnt-resultados">Resultados: 0</span>
    <span class="contador" id="cnt-duplicados">Duplicados: 0</span>
    <span class="contador" id="cnt-invalidos">Rejeitados: 0</span>
  </div>
  <div class="resultado" id="saida" aria-live="polite">O resultado aparecerá aqui...</div>

  <div class="rotulo">Copiar resultados</div>
  <div class="botoes">
    <button id="btn-copiar">Copiar normal</button>
    <button id="btn-copiar-linha">Copiar (linha única)</button>
    <button id="btn-copiar-virgula">Copiar com vírgulas</button>
    <button id="btn-copiar-sql-lista">SQL: lista de valores</button>
    <button id="btn-limpar" class="btn-largo btn-perigo">Limpar tudo</button>
  </div>

  <div class="gravador-separador">
    <button id="btn-gravar" class="btn-largo">🎥 Gravar tela</button>
    <div class="gravador-info">Abre o gravador integrado da extensão. Não requer instalação de programa.</div>
  </div>

  <p class="ajuda">No modo automático, todos tipos são identificados na ordem do texto.</p>
  <div class="status" id="status" role="status"></div>

  <script src="popup.js"></script>
</body>
</html>
