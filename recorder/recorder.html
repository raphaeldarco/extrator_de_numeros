<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gravador de Tela</title>
<link rel="stylesheet" href="recorder.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="dot"></span><div><h1>Gravador de Tela</h1><div class="sub">100% integrado à extensão</div></div></div>
    <span id="state" class="state state-ready">Pronto</span>
  </header>

  <section class="panel">
    <div class="settings">
      <label class="field">FPS <select id="fps"><option value="30">30</option><option value="60" selected>60</option></select></label>
      <label class="field">Qualidade <select id="quality"><option value="high" selected>Alta</option><option value="medium">Média</option><option value="low">Baixa</option></select></label>
      <div class="checks"><label><input type="checkbox" id="mic"> Microfone</label></div>
    </div>
    <div class="info" id="info">Escolha uma fonte de captura. O áudio do computador não é capturado.</div>
  </section>

  <section id="selectionPanel" class="selection-panel hidden">
    <div class="selection-head">
      <div>
        <strong>Selecione a área da gravação</strong>
        <span>Arraste sobre a prévia para definir o retângulo.</span>
      </div>
      <div id="selectionSize" class="selection-size">Área: —</div>
    </div>
    <div id="previewWrap" class="preview-wrap">
      <video id="preview" autoplay muted playsinline></video>
      <div id="selectionBox" class="selection-box hidden"></div>
      <div id="selectionHint">Clique e arraste para selecionar uma área</div>
    </div>
    <div class="selection-actions">
      <div class="left"><button id="selectFull" class="btn-secondary"><span class="icon icon-screen"></span>Tela inteira</button></div>
      <button id="startRecording" class="primary btn-start" disabled><span class="icon icon-record"></span>Iniciar gravação</button>
    </div>
  </section>

  <div class="controlbar">
    <div class="timer" id="timer">00:00:00</div>
    <div class="record-status" id="recordStatus">Pronto</div>
    <div class="actions">
      <button id="choose" class="primary btn-main"><span class="icon icon-screen"></span>Escolher tela</button>
      <button id="pause" class="btn-pause" disabled><span class="icon icon-pause"></span><span class="btn-label">Pausar</span></button>
      <button id="stop" class="danger btn-stop" disabled><span class="icon icon-stop"></span>Parar</button>
    </div>
  </div>

  <div class="bottom">
    <button id="download" class="btn-download" disabled><span class="icon icon-download"></span>Baixar vídeo</button>
    <button id="uploadDrive" class="btn-drive" disabled><span class="icon icon-cloud"></span>Enviar para Google Drive</button>
    <button id="close" class="btn-close">Fechar</button>
  </div>

  <div id="cloudStatus" class="cloud-status"></div>
  <div id="shareResult" class="share-result hidden">
    <div class="share-title"><span class="share-check">✓</span><span id="shareText">Vídeo enviado para o Google Drive</span></div>
    <div class="share-actions"><button id="copyLink" class="btn-secondary"><span class="icon icon-link"></span>Copiar link</button><button id="openLink" class="btn-secondary"><span class="icon icon-external"></span>Abrir</button></div>
  </div>
  <div id="error" class="error"></div>
</div>
<script src="drive.js"></script>
<script src="recorder.js"></script>
</body>
</html>
